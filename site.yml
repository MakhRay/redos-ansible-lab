---
- name: Установка и настройка Nginx и PHP в РЕД ОС 8
  hosts: webservers
  become: yes
  tasks:
    - name: Установка Nginx
      dnf:
        name: nginx
        state: present

    - name: Установка PHP
      dnf:
        name: php
        state: present

    - name: Включение Nginx в автозагрузку и запуск
      systemd:
        name: nginx
        enabled: yes
        state: started
